<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kota &amp; Kampus Hanyu: Misi Sehari-hari (Edisi Lengkap)</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --surface: #ffffff;
      --surface-alt: #ebf1f8;
      --ink: #141e30;
      --muted: #4b5a73;
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-soft: #dbeafe;
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --warn: #b45309;
      --warn-soft: #fef3c7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --border: #d5dfec;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(20, 30, 48, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.52;
    }

    .app-shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 16px 56px;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: -0.01em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .stat-pill {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 0.81rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover { border-color: var(--primary); }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .mentor-box {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdfa 100%);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 16px;
    }

    .mentor-avatar {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.05rem;
      flex-shrink: 0;
    }

    .mentor-name {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--primary-dark);
      margin-bottom: 2px;
    }

    .mentor-text {
      margin: 0;
      font-size: 0.92rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .chapter-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .chapter-card h3 {
      margin: 4px 0 4px;
      font-size: 0.98rem;
    }

    .chapter-meta {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .tag.ok { background: var(--accent-soft); color: var(--accent); border-color: #99f6e4; }
    .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: #fde68a; }
    .tag.boss { background: #ede9fe; color: #5b21b6; border-color: #ddd6fe; }

    .btn {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-outline {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border);
    }
    .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: 6px 11px; font-size: 0.81rem; }

    .mission-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .dialogue-box {
      background: #f8fafd;
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 10px 0;
    }

    .dialogue-turn {
      margin-bottom: 8px;
    }
    .dialogue-turn:last-child { margin-bottom: 0; }

    .speaker-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .hanzi-display {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 6px 0 2px;
      color: var(--ink);
    }

    .pinyin-display {
      font-size: 0.94rem;
      color: var(--primary);
      font-weight: 600;
    }

    .meaning-display {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .options-list {
      display: grid;
      gap: 9px;
      margin: 14px 0;
    }

    .option-btn {
      text-align: left;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.91rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #f8fbff;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }

    .builder-pool, .builder-target {
      min-height: 52px;
      border: 1px dashed #9fb0cc;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--surface-alt);
      margin: 10px 0;
    }

    .builder-target {
      border-style: solid;
      background: #f8fbff;
    }

    .token-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }

    .token-chip:hover { border-color: var(--primary); }

    .feedback-box {
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 12px;
      font-size: 0.89rem;
    }

    .feedback-box.ok {
      background: var(--accent-soft);
      border: 1px solid #5eead4;
      color: #115e59;
    }

    .feedback-box.err {
      background: var(--danger-soft);
      border: 1px solid #fca5a5;
      color: #7f1d1d;
    }

    .feedback-box.hint {
      background: var(--warn-soft);
      border: 1px solid #fcd34d;
      color: #78350f;
    }

    .speaking-panel {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .audio-status {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .vocab-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .vocab-table th, .vocab-table td {
      border-bottom: 1px solid var(--border);
      padding: 9px 10px;
      text-align: left;
    }

    .vocab-table th {
      background: var(--surface-alt);
      font-weight: 700;
    }

    .review-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--surface);
    }

    .progress-bar-wrap {
      height: 8px;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    .mode-switch {
      display: inline-flex;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .mode-chip {
      border: none;
      background: transparent;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-chip.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-input {
      flex: 1;
      min-width: 210px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
    }

    @media (max-width: 600px) {
      .hanzi-display { font-size: 1.28rem; }
      .topbar { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Kota &amp; Kampus Hanyu: Misi Sehari-hari</h1>
        <p>Edisi Lengkap • Menyimak, Tata Bahasa, Roleplay Dialog &amp; Speaking Lab</p>
      </div>
      <div class="stats-row" id="statsBar"></div>
    </header>

    <nav class="nav-tabs" aria-label="Navigasi Utama">
      <button class="tab-btn active" data-tab="peta" onclick="switchTab('peta')">Peta 7 Bab</button>
      <button class="tab-btn" data-tab="misi" onclick="switchTab('misi')">Ruang Misi</button>
      <button class="tab-btn" data-tab="kamus" onclick="switchTab('kamus')">Kamus &amp; Pola</button>
      <button class="tab-btn" data-tab="ulang" onclick="switchTab('ulang')">Perlu Diulang <span id="reviewCountBadge"></span></button>
      <button class="tab-btn" data-tab="profil" onclick="switchTab('profil')">Profil &amp; Lencana</button>
    </nav>

    <section class="mentor-box">
      <div class="mentor-avatar">林</div>
      <div>
        <div class="mentor-name">Lǎoshī Lín (老师林)</div>
        <p class="mentor-text" id="mentorMsg">
          Halo Rafi! Ini versi lengkap 7 bab dari dasar pelafalan sampai simulasi situasi nyata. Jangan lupa aktifkan audio untuk latihan listening &amp; speaking di setiap bab!
        </p>
      </div>
    </section>

    <main id="mainContent"></main>
  </div>

  <script>
    const STORAGE_KEY = "hanyu_kota_kampus_complete_v2";

    const VOCAB_BANK = [
      { ch: "Bab 1", hanzi: "你好 / 您好", pinyin: "nǐ hǎo / nín hǎo", meaning: "Halo (teman / sopan)", note: "你好 dilafalkan ní hǎo (三声变调)." },
      { ch: "Bab 1", hanzi: "早上好 / 下午好 / 晚上好", pinyin: "zǎoshang / xiàwǔ / wǎnshang hǎo", meaning: "Selamat pagi / siang-sore / malam", note: "Sapaan berdasarkan waktu hari." },
      { ch: "Bab 1", hanzi: "谢谢 / 不客气", pinyin: "xièxie / bú kèqi", meaning: "Terima kasih / Sama-sama", note: "不 berubah nada ke-2 (bú) sebelum nada ke-4." },
      { ch: "Bab 1", hanzi: "对不起 / 没关系", pinyin: "duìbuqǐ / méi guānxi", meaning: "Maaf / Tidak apa-apa", note: "Pasangan ungkapan meminta dan memberi maaf." },
      { ch: "Bab 1", hanzi: "姓 / 叫 / 哪国人", pinyin: "xìng / jiào / nǎ guó rén", meaning: "Bermarga / bernama / orang negara mana", note: "请问您贵姓？ = Permisi, marga Anda siapa?" },
      { ch: "Bab 1", hanzi: "认识你很高兴", pinyin: "rènshi nǐ hěn gāoxìng", meaning: "Senang berkenalan denganmu", note: "Ungkapan standar setelah perkenalan." },

      { ch: "Bab 2", hanzi: "这 / 那 / 什么 / 谁", pinyin: "zhè / nà / shénme / shéi", meaning: "Ini / itu / apa / siapa", note: "Kata tunjuk dan kata tanya dasar." },
      { ch: "Bab 2", hanzi: "本 / 个 / 口 / 位", pinyin: "běn / gè / kǒu / wèi", meaning: "Satuan buku / umum / anggota keluarga / orang (sopan)", note: "三本词典, 四口人, 一位老师." },
      { ch: "Bab 2", hanzi: "几 / 多少", pinyin: "jǐ / duōshao", meaning: "Berapa (<10) / berapa (umum/banyak)", note: "你们班有多少人？" },
      { ch: "Bab 2", hanzi: "有 / 没有", pinyin: "yǒu / méiyǒu", meaning: "Punya (ada) / tidak punya (tidak ada)", note: "Penyangkalan 有 selalu pakai 没, bukan 不." },

      { ch: "Bab 3", hanzi: "多少钱 / 块(元) / 毛 / 分", pinyin: "duōshao qián / kuài (yuán) / máo / fēn", meaning: "Berapa harganya / satuan mata uang RMB", note: "1 块 = 10 毛; 块 untuk lisan, 元 untuk tulisan." },
      { ch: "Bab 3", hanzi: "一斤 / 瓶 / 份", pinyin: "yì jīn / píng / fèn", meaning: "Setengah kg (500g) / botol / porsi", note: "苹果多少钱一斤？" },
      { ch: "Bab 3", hanzi: "月 / 号(日) / 星期", pinyin: "yuè / hào (rì) / xīngqī", meaning: "Bulan / tanggal / hari dalam pekan", note: "Urutan: Bulan dulu lalu Tanggal (六月五号)." },
      { ch: "Bab 3", hanzi: "点 / 分 / 半 / 刻 / 差", pinyin: "diǎn / fēn / bàn / kè / chà", meaning: "Jam / menit / setengah / 15 menit / kurang", note: "差一刻八点 = jam 8 kurang 15 menit (07:45)." },

      { ch: "Bab 4", hanzi: "前边 / 后边 / 旁边 / 对面", pinyin: "qiánbiān / hòubiān / pángbiān / duìmiàn", meaning: "Depan / belakang / samping / seberang", note: "银行在超市旁边。" },
      { ch: "Bab 4", hanzi: "东边 / 西边 / 南边 / 北边", pinyin: "dōngbiān / xībiān / nánbiān / běibiān", meaning: "Timur / barat / selatan / utara", note: "Arah mata angin." },
      { ch: "Bab 4", hanzi: "从……到……", pinyin: "cóng ... dào ...", meaning: "Dari ... sampai ...", note: "从学校到车站很近。" },
      { ch: "Bab 4", hanzi: "还是 / 或者", pinyin: "háishì / huòzhě", meaning: "Atau (kalimat tanya) / atau (kalimat berita)", note: "坐汽车好，还是骑自行车好？" },

      { ch: "Bab 5", hanzi: "了 / 没(有)", pinyin: "le / méi(yǒu)", meaning: "Partikel perubahan/selesai / belum atau tidak terjadi", note: "你吃早饭了吗？— 我还没吃。" },

      { ch: "Bab 5", hanzi: "有点儿 + Adj", pinyin: "yǒudiǎnr + Adj", meaning: "Agak / sedikit (untuk kondisi kurang nyaman)", note: "我今天有点儿头疼。" },

      { ch: "Bab 6", hanzi: "把 + Objek + Kata Kerja + Posisi/Hasil", pinyin: "bǎ + O + V + C", meaning: "Konstruksi perlakuan terhadap objek tertentu", note: "把电话号码写在这儿。" },

    const CHAPTERS = [
      {
        id: "bab1",
        title: "Bab 1: Pelafalan, Sapaan & Perkenalan",

          {

              "Keduanya diucapkan tanpa nada sama sekali"

            answer: 0,

    function syncEnergyAndStreak(st) {
      const now = Date.now();
      const elapsedMin = Math.floor((now - (st.lastEnergyTick || now)) / 60000);
      if (elapsedMin >= 3 && st.energy < 5) {
        const recover = Math.min(5 - st.energy, Math.floor(elapsedMin / 3));
        st.energy += recover;
        st.lastEnergyTick = now;
      } else if (st.energy >= 5) {
        st.lastEnergyTick = now;
      }

      const today = new Date().toISOString().slice(0, 10);
      if (st.lastPlayDate !== today) {
        const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
        st.streak = st.lastPlayDate === yesterday ? st.streak + 1 : 1;
        st.lastPlayDate = today;
      }
      return st;
    }

    let speakingVerified = false;
    let speechRate = 0.9;

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderStatsBar();
      renderReviewBadge();
    }

    function getLevel(xp) {
      return Math.floor(xp / 100) + 1;
    }

    function setMentor(msg) {
      const el = document.getElementById("mentorMsg");
      if (el) el.textContent = msg;
    }

    function renderStatsBar() {
      const lvl = getLevel(state.xp);
      const bar = document.getElementById("statsBar");
      bar.innerHTML = `
        <span class="stat-pill">Lv.${lvl} • ${state.xp} XP</span>
        <span class="stat-pill">Energi: ${state.energy}/5</span>
        <span class="stat-pill">Streak: ${state.streak} hari</span>
        <div class="mode-switch" title="Mode Belajar: bebas latihan. Mode Tantangan: memakai Energi.">
          <button class="mode-chip ${state.mode === "belajar" ? "active" : ""}" onclick="setMode('belajar')">Belajar</button>
          <button class="mode-chip ${state.mode === "tantangan" ? "active" : ""}" onclick="setMode('tantangan')">Tantangan</button>
        </div>
      `;
    }

    function renderReviewBadge() {
      const badge = document.getElementById("reviewCountBadge");
      if (!badge) return;
      badge.textContent = state.reviewQueue.length > 0 ? `(${state.reviewQueue.length})` : "";
    }

    function setMode(newMode) {
      state.mode = newMode;
      saveState();
      setMentor(
        newMode === "tantangan"
          ? "Mode Tantangan aktif: jawaban salah mengurangi 1 Energi—cocok untuk simulasi kesiapan ujian!"
          : "Mode Belajar aktif: latihan santai tanpa potongan energi, bebas mengulang audio dan speaking."
      );
      renderCurrentTab();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      saveState();
      renderCurrentTab();
    }

    function findMission(chapterId, missionId) {
      const ch = CHAPTERS.find((c) => c.id === chapterId);
      if (!ch) return null;
      return ch.missions.find((m) => m.id === missionId) || null;
    }

    function startChapter(chapterId, missionIdx = 0) {
      state.currentChapterId = chapterId;
      state.currentMissionIndex = missionIdx;
      state.activeTab = "misi";
      resetMissionScratch();
      const ch = CHAPTERS.find((c) => c.id === chapterId);
      setMentor(`Memasuki ${ch.title}. Dengarkan audionya, cermati struktur kalimatnya, dan praktikkan speaking!`);
      saveState();
      document.querySelectorAll(".tab-btn").forEach((b) => {
        b.classList.toggle("active", b.dataset.tab === "misi");
      });
      renderCurrentTab();
    }

    function resetMissionScratch() {
      hintLevel = 0;
      selectedOption = null;
      builtTokens = [];
      lastFeedback = null;
      speakingVerified = false;
      if (recordedUrl) {
        URL.revokeObjectURL(recordedUrl);
        recordedUrl = null;
      }
    }

    function renderCurrentTab() {
      renderStatsBar();
      renderReviewBadge();
      const container = document.getElementById("mainContent");
      if (state.activeTab === "peta") container.innerHTML = renderMapView();
      else if (state.activeTab === "misi") container.innerHTML = renderMissionView();
      else if (state.activeTab === "kamus") container.innerHTML = renderVocabView();
      else if (state.activeTab === "ulang") container.innerHTML = renderReviewView();
      else container.innerHTML = renderProfileView();
    }

    function renderMapView() {
      const cards = CHAPTERS.map((ch) => {
        const doneCount = ch.missions.filter((m) => state.completedMissions[m.id]).length;
        const pct = Math.round((doneCount / ch.missions.length) * 100);
        const stars = state.chapterStars[ch.id] || 0;
        const hasBadge = state.badges.includes(ch.badgeName);
        return `
          <article class="chapter-card">
            <div>
              <div class="chapter-meta">${ch.subtitle}</div>
              <h3>${ch.title}</h3>
              <p style="margin:0 0 8px;font-size:0.86rem;color:var(--muted);">${ch.summary}</p>
              <div class="badge-row">
                <span class="tag">${doneCount}/${ch.missions.length} Misi</span>
                <span class="tag ok">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</span>
                ${hasBadge ? `<span class="tag warn">Lencana: ${ch.badgeName}</span>` : ""}
              </div>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" style="width:${pct}%"></div>
              </div>
            </div>
            <button class="btn btn-primary" onclick="startChapter('${ch.id}', 0)">
              ${doneCount > 0 ? "Lanjutkan Bab" : "Mulai Bab"}
            </button>
          </article>
        `;
      }).join("");

      return `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
            <div>
              <h2 style="margin:0 0 4px;font-size:1.1rem;">Peta 7 Bab — Kampus &amp; Kota Hanyu</h2>
              <p style="margin:0;font-size:0.86rem;color:var(--muted);">
                Setiap bab memuat misi Menyimak (Listening), Tata Bahasa, Susun Kalimat, Speaking, dan Boss Bab.
              </p>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:0.82rem;color:var(--muted);">Tempo Suara:</span>
              <button class="btn btn-outline btn-sm" onclick="setSpeechRate(0.75)">${speechRate === 0.75 ? "✓ " : ""}Pelan (0.75x)</button>
              <button class="btn btn-outline btn-sm" onclick="setSpeechRate(0.9)">${speechRate === 0.9 ? "✓ " : ""}Normal (0.9x)</button>
            </div>
          </div>
          <div class="chapter-grid">${cards}</div>
        </div>
      `;
    }

    function setSpeechRate(rate) {
      speechRate = rate;
      setMentor(`Tempo pengucapan Mandarin diatur ke ${rate}x.`);
      renderCurrentTab();
    }

    function renderMissionView() {
      const ch = CHAPTERS.find((c) => c.id === state.currentChapterId) || CHAPTERS[0];
      const mission = ch.missions[state.currentMissionIndex] || ch.missions[0];

      if (state.mode === "tantangan" && state.energy <= 0) {
        return `
          <div class="card">
            <h2 style="margin-top:0;">Energi Habis</h2>
            <p style="color:var(--muted);">
              Energi pulih 1 poin setiap 3 menit, atau kamu bisa beralih ke <strong>Mode Belajar</strong> maupun mengulas daftar <strong>Perlu Diulang</strong>.
            </p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-primary" onclick="setMode('belajar')">Pindah ke Mode Belajar</button>
              <button class="btn btn-outline" onclick="switchTab('ulang')">Buka Perlu Diulang</button>
            </div>
          </div>
        `;
      }

      let stimulusHtml = "";
      if (mission.type === "listening" && mission.dialogue) {
        stimulusHtml = `
          <div style="margin:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
            <button class="btn btn-accent btn-sm" onclick="speakChinese('${escapeAttr(mission.audioText)}')">Putar Audio Dialog</button>
            <button class="btn btn-outline btn-sm" onclick="speakChineseSlow('${escapeAttr(mission.audioText)}')">Putar Pelan</button>
          </div>
          <div class="dialogue-box">
            ${mission.dialogue.map((turn) => `
              <div class="dialogue-turn">
                <div class="speaker-label">${escapeHtml(turn.speaker)}</div>
                <div style="font-size:1.12rem;font-weight:700;">${escapeHtml(turn.hanzi)}</div>
                <div style="font-size:0.86rem;color:var(--primary);font-weight:600;">${escapeHtml(turn.pinyin)}</div>
                <div style="font-size:0.83rem;color:var(--muted);">${escapeHtml(turn.meaning)}</div>
              </div>
            `).join("")}
          </div>
        `;
      } else {
        stimulusHtml = `
          ${mission.hanzi ? `<div class="hanzi-display">${escapeHtml(mission.hanzi)}</div>` : ""}
          ${mission.pinyin ? `<div class="pinyin-display">${escapeHtml(mission.pinyin)}</div>` : ""}
          ${mission.meaning ? `<div class="meaning-display">Arti: ${escapeHtml(mission.meaning)}</div>` : ""}
        `;
      }

      let bodyHtml = "";
      if (mission.type === "choice" || mission.type === "listening") {
        bodyHtml = `
          <div class="options-list">
            ${mission.options.map((opt, idx) => `
              <button class="option-btn ${selectedOption === idx ? "selected" : ""}" onclick="pickOption(${idx})">
                ${escapeHtml(opt)}
              </button>
            `).join("")}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button class="btn btn-primary" onclick="checkChoice()" ${selectedOption === null ? "disabled" : ""}>Periksa Jawaban</button>
            <button class="btn btn-outline btn-sm" onclick="showNextHint()">Petunjuk (${hintLevel}/${mission.hints.length})</button>
          </div>
        `;
      } else if (mission.type === "order") {
        const remaining = [];
        const temp = [...builtTokens];
        for (const tok of mission.tokens) {
          const foundIdx = temp.indexOf(tok);
          if (foundIdx !== -1) temp.splice(foundIdx, 1);
          else remaining.push(tok);
        }
        bodyHtml = `
          <div style="font-size:0.84rem;color:var(--muted);">Susunan kalimatmu (klik token untuk melepas):</div>
          <div class="builder-target">
            ${builtTokens.length === 0
              ? `<span style="color:var(--muted);font-size:0.85rem;">Belum ada kata dipilih...</span>`
              : builtTokens.map((t, i) => `<button class="token-chip" onclick="removeToken(${i})">${escapeHtml(t)}</button>`).join("")}
          </div>
          <div style="font-size:0.84rem;color:var(--muted);">Pilihan kata:</div>
          <div class="builder-pool">
            ${remaining.map((t) => `<button class="token-chip" onclick="addToken('${escapeAttr(t)}')">${escapeHtml(t)}</button>`).join("")}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button class="btn btn-primary" onclick="checkOrder()" ${builtTokens.length === 0 ? "disabled" : ""}>Periksa Susunan</button>
            <button class="btn btn-outline btn-sm" onclick="clearTokens()">Reset</button>
            <button class="btn btn-outline btn-sm" onclick="showNextHint()">Petunjuk (${hintLevel}/${mission.hints.length})</button>
          </div>
        `;
      } else if (mission.type === "speaking") {
        bodyHtml = `
          <div class="speaking-panel">
            <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
              <button class="btn btn-accent btn-sm" onclick="speakChinese('${escapeAttr(mission.hanzi)}')">Dengar Contoh</button>
              <button class="btn btn-outline btn-sm" onclick="speakChineseSlow('${escapeAttr(mission.hanzi)}')">Dengar Pelan</button>
              <button class="btn btn-outline btn-sm" id="recBtn" onclick="toggleRecording()">Rekam Suara</button>
              <button class="btn btn-outline btn-sm" onclick="trySpeechRecognition('${escapeAttr(mission.hanzi)}')">Cek Suara Otomatis</button>
              <button class="btn btn-primary btn-sm" onclick="confirmSpeakingManual()">Saya Sudah Mengucapkan dengan Lantang</button>
            </div>
            <div id="recordedAudioBox" style="margin-top:10px;">
              ${recordedUrl ? `<audio controls src="${recordedUrl}"></audio>` : ""}
            </div>
            <div class="audio-status" id="speakingStatus">
              ${speakingVerified
                ? "Ucapan sudah tercatat! Lanjutkan ke misi berikutnya."
                : "Tips: dengarkan contohnya, ucapkan lantang, lalu rekam atau klik tombol konfirmasi."}
            </div>
          </div>
          <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" onclick="showNextHint()">Petunjuk (${hintLevel}/${mission.hints.length})</button>
          </div>
        `;
      }

      const feedbackHtml = lastFeedback
        ? `<div class="feedback-box ${lastFeedback.kind}">${lastFeedback.html}</div>`
        : "";

      const isCompleted = !!state.completedMissions[mission.id];
      const isBoss = state.currentMissionIndex === ch.missions.length - 1;

      return `
        <div class="card">
          <div class="mission-header">
            <div>
              <span class="tag">${escapeHtml(ch.title)}</span>
              <span class="tag ${isBoss ? "boss" : "ok"}">${escapeHtml(mission.topic)}</span>
              ${isCompleted ? `<span class="tag warn">Sudah Tuntas</span>` : ""}
            </div>
            <div style="font-size:0.84rem;color:var(--muted);">
              Misi ${state.currentMissionIndex + 1} dari ${ch.missions.length}
            </div>
          </div>

          <p style="margin:0 0 8px;font-weight:600;">${escapeHtml(mission.prompt)}</p>
          ${stimulusHtml}
          ${bodyHtml}
          ${feedbackHtml}

          <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm" onclick="prevMission()" ${state.currentMissionIndex === 0 ? "disabled" : ""}>← Misi Sebelumnya</button>
            <button class="btn btn-primary btn-sm" onclick="nextMission()">
              ${state.currentMissionIndex < ch.missions.length - 1 ? "Misi Berikutnya →" : "Selesaikan Bab"}
            </button>
          </div>
        </div>
      `;
    }

    function pickOption(idx) {
      selectedOption = idx;
      renderCurrentTab();
    }

    function addToken(tok) {
      builtTokens.push(tok);
      renderCurrentTab();
    }

    function removeToken(index) {
      builtTokens.splice(index, 1);
      renderCurrentTab();
    }

    function clearTokens() {
      builtTokens = [];
      renderCurrentTab();
    }

    function showNextHint() {
      const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
      const mission = ch.missions[state.currentMissionIndex];
      if (hintLevel < mission.hints.length) {
        hintLevel += 1;
      }
      const visibleHints = mission.hints.slice(0, hintLevel).map((h, i) => `<div>• <strong>Petunjuk ${i + 1}:</strong> ${escapeHtml(h)}</div>`).join("");
      lastFeedback = {
        kind: "hint",
        html: `<strong>Bantuan Bertingkat:</strong>${visibleHints}`
      };
      renderCurrentTab();
    }

    function enqueueReview(chapterId, missionId, reason) {
      const exists = state.reviewQueue.some((item) => item.missionId === missionId);
      if (!exists) {
        state.reviewQueue.push({ chapterId, missionId, reason });
      }
    }

    function markMissionSuccess(ch, mission, bonusXp = 25) {
      const firstTime = !state.completedMissions[mission.id];
      state.completedMissions[mission.id] = true;
      state.consecutiveCorrect += 1;
      state.consecutiveWrong = 0;

      const streakBonus = state.consecutiveCorrect >= 2 ? 5 : 0;
      const gained = (firstTime ? bonusXp : 10) + streakBonus;
      state.xp += gained;

      state.reviewQueue = state.reviewQueue.filter((item) => item.missionId !== mission.id);

      const doneInChapter = ch.missions.filter((m) => state.completedMissions[m.id]).length;
      const ratio = doneInChapter / ch.missions.length;
      const stars = ratio >= 1 ? 3 : ratio >= 0.6 ? 2 : 1;
      state.chapterStars[ch.id] = Math.max(state.chapterStars[ch.id] || 0, stars);

      if (ratio >= 1 && !state.badges.includes(ch.badgeName)) {
        state.badges.push(ch.badgeName);
      }

      const pacingNote = state.consecutiveCorrect >= 2
        ? "Ritmemu mantap—lanjutkan ke misi berikutnya!"
        : "Bagus! Pemahaman dan ketepatanmu makin solid.";

      lastFeedback = {
        kind: "ok",
        html: `<strong>Tepat! (+${gained} XP)</strong> — ${escapeHtml(mission.explain)}<div style="margin-top:4px;font-size:0.84rem;">${escapeHtml(pacingNote)}</div>`
      };
      setMentor(pacingNote);
      saveState();
      renderCurrentTab();
    }

    function markMissionWrong(ch, mission, detailText) {
      state.consecutiveWrong += 1;
      state.consecutiveCorrect = 0;

      if (state.mode === "tantangan") {
        state.energy = Math.max(0, state.energy - 1);
      }

      enqueueReview(ch.id, mission.id, mission.topic);

      const gentleNote = state.consecutiveWrong >= 2
        ? "Tenang, kita pelan-pelan dulu ya. Gunakan tombol Petunjuk dan fokus pada kata kuncinya."
        : "Belum pas—simak penjelasannya dulu, dan soal ini sudah masuk ke daftar Perlu Diulang.";

      lastFeedback = {
        kind: "err",
        html: `<strong>Belum tepat.</strong> ${escapeHtml(detailText)} <br/><em>Penjelasan:</em> ${escapeHtml(mission.explain)} <div style="margin-top:4px;font-size:0.84rem;">Masuk otomatis ke antrean <strong>Perlu Diulang</strong>.</div>`
      };
      setMentor(gentleNote);
      saveState();
      renderCurrentTab();
    }

    function checkChoice() {
      const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
      const mission = ch.missions[state.currentMissionIndex];
      if (selectedOption === null) return;

      if (selectedOption === mission.answer) {
        markMissionSuccess(ch, mission, 25);
      } else {
        markMissionWrong(ch, mission, `Pilihan yang benar adalah: ${mission.options[mission.answer]}.`);
      }
    }

    function checkOrder() {
      const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
      const mission = ch.missions[state.currentMissionIndex];
      const isMatch =
        builtTokens.length === mission.answer.length &&
        builtTokens.every((tok, idx) => tok === mission.answer[idx]);

      if (isMatch) {
        markMissionSuccess(ch, mission, 30);
      } else {
        markMissionWrong(ch, mission, `Susunan yang tepat: ${mission.answer.join(" ")}.`);
      }
    }

    function speakChinese(text) {
      playTTS(text, speechRate);
    }

    function speakChineseSlow(text) {
      playTTS(text, 0.72);
    }

    function playTTS(text, rateVal) {
      if (!("speechSynthesis" in window)) {
        setMentor("Browser ini belum mendukung pembaca suara otomatis, jadi kamu bisa melafalkannya langsung berdasarkan pinyin & arti.");
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "zh-CN";
      utter.rate = rateVal;
      window.speechSynthesis.speak(utter);
    }

    async function toggleRecording() {
      const btn = document.getElementById("recBtn");
      const status = document.getElementById("speakingStatus");

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        if (btn) btn.textContent = "Rekam Suara";
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (status) status.textContent = "Perekam mikrofon tidak tersedia di browser ini. Gunakan tombol 'Saya Sudah Mengucapkan dengan Lantang'.";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          if (recordedUrl) URL.revokeObjectURL(recordedUrl);
          recordedUrl = URL.createObjectURL(blob);
          speakingVerified = true;
          const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
          const mission = ch.missions[state.currentMissionIndex];
          state.speakingDoneCount += 1;
          markMissionSuccess(ch, mission, 30);
        };
        mediaRecorder.start();
        if (btn) btn.textContent = "Stop Rekaman";
        if (status) status.textContent = "Sedang merekam suaramu... ucapkan kalimatnya lalu klik Stop Rekaman.";
      } catch {
        if (status) status.textContent = "Izin mikrofon ditolak atau tidak aktif. Kamu tetap bisa klik 'Saya Sudah Mengucapkan dengan Lantang'.";
      }
    }

    function trySpeechRecognition(targetHanzi) {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const status = document.getElementById("speakingStatus");
      if (!SpeechRec) {
        if (status) status.textContent = "Pengenalan suara otomatis belum tersedia di browser ini; pakai Rekam Suara atau tombol konfirmasi manual.";
        return;
      }
      const rec = new SpeechRec();
      rec.lang = "zh-CN";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      if (status) status.textContent = "Mendengarkan ucapan Mandarinmu...";

      rec.onresult = (event) => {
        const transcript = event.results[0][0].transcript || "";
        speakingVerified = true;
        const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
        const mission = ch.missions[state.currentMissionIndex];
        state.speakingDoneCount += 1;
        markMissionSuccess(ch, mission, 35);
        lastFeedback.html += `<div style="margin-top:4px;font-size:0.84rem;">Terdeteksi: <strong>${escapeHtml(transcript)}</strong> (Target: ${escapeHtml(targetHanzi)})</div>`;
        renderCurrentTab();
      };

      rec.onerror = () => {
        if (status) status.textContent = "Tidak menangkap suara dengan jelas. Coba lagi atau gunakan tombol 'Saya Sudah Mengucapkan dengan Lantang'.";
      };

      rec.start();
    }

    function confirmSpeakingManual() {
      const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
      const mission = ch.missions[state.currentMissionIndex];
      speakingVerified = true;
      state.speakingDoneCount += 1;
      markMissionSuccess(ch, mission, 25);
    }

    function nextMission() {
      const ch = CHAPTERS.find((c) => c.id === state.currentChapterId);
      resetMissionScratch();
      if (state.currentMissionIndex < ch.missions.length - 1) {
        state.currentMissionIndex += 1;
        saveState();
        renderCurrentTab();
      } else {
        setMentor(`${ch.title} selesai! Kamu bisa mengulang bab ini atau memilih bab berikutnya di Peta 7 Bab.`);
        state.activeTab = "peta";
        saveState();
        document.querySelectorAll(".tab-btn").forEach((b) => {
          b.classList.toggle("active", b.dataset.tab === "peta");
        });
        renderCurrentTab();
      }
    }

    function prevMission() {
      if (state.currentMissionIndex > 0) {
        resetMissionScratch();
        state.currentMissionIndex -= 1;
        saveState();
        renderCurrentTab();
      }
    }

    function setVocabFilter(val) {
      state.vocabFilter = val;
      renderCurrentTab();
    }

    function setVocabSearch(val) {
      state.vocabSearch = val;
      renderCurrentTab();
    }

    function renderVocabView() {
      const groups = ["Semua", "Bab 1", "Bab 2", "Bab 3", "Bab 4", "Bab 5", "Bab 6", "Bab 7"];
      const q = (state.vocabSearch || "").toLowerCase().trim();
      const filtered = VOCAB_BANK.filter((item) => {
        const matchGroup = state.vocabFilter === "Semua" || item.ch === state.vocabFilter;
        const matchText =
          !q ||
          item.hanzi.toLowerCase().includes(q) ||
          item.pinyin.toLowerCase().includes(q) ||
          item.meaning.toLowerCase().includes(q) ||
          item.note.toLowerCase().includes(q);
        return matchGroup && matchText;
      });

      const rows = filtered.map((v) => `
        <tr>
          <td><span class="tag">${escapeHtml(v.ch)}</span></td>
          <td style="font-size:1.05rem;font-weight:700;">${escapeHtml(v.hanzi)}</td>
          <td style="color:var(--primary);font-weight:600;">${escapeHtml(v.pinyin)}</td>
          <td>${escapeHtml(v.meaning)}</td>
          <td style="color:var(--muted);font-size:0.83rem;">${escapeHtml(v.note)}</td>
          <td><button class="btn btn-outline btn-sm" onclick="speakChinese('${escapeAttr(v.hanzi.split('/')[0].trim())}')">Dengar</button></td>
        </tr>
      `).join("");

      return `
        <div class="card">
          <h2 style="margin-top:0;">Kamus Inti &amp; Pola Kalimat (7 Bab)</h2>
          <p style="color:var(--muted);font-size:0.86rem;">Klik tombol <strong>Dengar</strong> untuk melatih pelafalan kosakata &amp; pola kalimat kapan saja.</p>
          <div class="filter-bar">
            <input
              class="search-input"
              type="text"
              placeholder="Cari Hanzi, pinyin, arti, atau catatan tata bahasa..."
              value="${escapeAttr(state.vocabSearch || "")}"
              oninput="setVocabSearch(this.value)"
            />
          </div>
          <div class="badge-row" style="margin-bottom:12px;">
            ${groups.map((g) => `
              <button class="btn btn-sm ${state.vocabFilter === g ? "btn-primary" : "btn-outline"}" onclick="setVocabFilter('${g}')">${g}</button>
            `).join("")}
          </div>
          <div style="overflow-x:auto;">
            <table class="vocab-table">
              <thead>
                <tr>
                  <th>Bab</th>
                  <th>Hanzi</th>
                  <th>Pinyin</th>
                  <th>Arti</th>
                  <th>Catatan Pola</th>
                  <th>Audio</th>
                </tr>
              </thead>
              <tbody>
                ${rows || `<tr><td colspan="6" style="color:var(--muted);">Tidak ada kosakata yang cocok dengan pencarian.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderReviewView() {
      if (state.reviewQueue.length === 0) {
        return `
          <div class="card">
            <h2 style="margin-top:0;">Antrean Perlu Diulang</h2>
            <p style="color:var(--muted);margin:0;">
              Belum ada misi yang perlu diulang saat ini. Setiap jawaban yang belum tepat akan otomatis masuk ke sini untuk pengulangan berjarak.
            </p>
          </div>
        `;
      }

      const itemsHtml = state.reviewQueue.map((item) => {
        const m = findMission(item.chapterId, item.missionId);
        const ch = CHAPTERS.find((c) => c.id === item.chapterId);
        const idx = ch ? ch.missions.findIndex((x) => x.id === item.missionId) : 0;
        if (!m) return "";
        return `
          <div class="review-item">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
              <span class="tag warn">${escapeHtml(item.reason)}</span>
              <button class="btn btn-primary btn-sm" onclick="startChapter('${item.chapterId}', ${idx})">Latih Lagi</button>
            </div>
            <p style="margin:8px 0 4px;font-weight:600;">${escapeHtml(m.prompt)}</p>
            ${m.hanzi ? `<div style="font-size:1.15rem;font-weight:700;">${escapeHtml(m.hanzi)}</div>` : ""}
            <div style="font-size:0.86rem;color:var(--muted);margin-top:4px;">${escapeHtml(m.explain)}</div>
          </div>
        `;
      }).join("");

      return `
        <div class="card">
          <h2 style="margin-top:0;">Antrean Perlu Diulang (${state.reviewQueue.length})</h2>
          <p style="color:var(--muted);font-size:0.88rem;">Ulangi misi yang sempat terlewat agar semakin lengket di ingatan.</p>
          ${itemsHtml}
        </div>
      `;
    }

    function renderProfileView() {
      const totalMissions = CHAPTERS.reduce((acc, c) => acc + c.missions.length, 0);
      const doneTotal = Object.keys(state.completedMissions).length;
      const badgeList = state.badges.length > 0
        ? state.badges.map((b) => `<span class="tag ok">${escapeHtml(b)}</span>`).join("")
        : `<span style="color:var(--muted);font-size:0.88rem;">Belum ada lencana terbuka—selesaikan seluruh misi dalam satu bab untuk mendapatkannya.</span>`;

      return `
        <div class="card">
          <h2 style="margin-top:0;">Profil &amp; Pencapaian</h2>
          <p style="margin:0 0 12px;color:var(--muted);font-size:0.9rem;">
            Pemain: <strong>Rafi</strong> • Level <strong>${getLevel(state.xp)}</strong> • Total XP: <strong>${state.xp}</strong> • Sesi Speaking Tuntas: <strong>${state.speakingDoneCount}</strong>
          </p>
          <p style="margin:0 0 12px;font-size:0.9rem;">
            Progres Keseluruhan: <strong>${doneTotal}/${totalMissions}</strong> misi selesai.
          </p>
          <div style="margin-bottom:14px;">
            <div style="font-weight:600;margin-bottom:6px;">Lencana Terkumpul:</div>
            <div class="badge-row">${badgeList}</div>
          </div>
          <button class="btn btn-outline btn-sm" onclick="resetProgress()">Reset Progres Lokal</button>
        </div>
      `;
    }

    function resetProgress() {
      localStorage.removeItem(STORAGE_KEY);
      state = loadState();
      resetMissionScratch();
      setMentor("Progres lokal sudah direset. Yuk mulai lagi dari Bab 1 dengan santai!");
      renderCurrentTab();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    renderCurrentTab();
  </script>
</body>
</html>
